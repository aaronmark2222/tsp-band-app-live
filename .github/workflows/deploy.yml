name: Deploy TSP Work to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: JavaScript syntax (a broken app.js must never reach the band)
        run: |
          cp app.js /tmp/app.mjs && node --check /tmp/app.mjs
          cp boot.js /tmp/boot.mjs && node --check /tmp/boot.mjs
          node --check sw.js
      - name: Published files exist and the cache markers are present
        run: |
          for f in index.html app.js boot.js styles.css sw.js apple-touch-icon.png assets/the-string-project-logo.png vendor/jsqr.js; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          grep -q 'app.js?v=' index.html && grep -q 'styles.css?v=' index.html
          grep -q 'Content-Security-Policy' index.html
      - name: Frontend tests
        run: node --test tests/*.test.js tools/ableton-remote-script/tests/*.test.js
      - name: TSPWork syntax and tests (no Ableton needed)
        run: |
          python3 -m py_compile tools/ableton-remote-script/TSPWork/*.py
          cd tools/ableton-remote-script && python3 -m unittest discover -s tests -p 'test_*.py'

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out site files
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage only the public app
        run: |
          mkdir -p _site/assets _site/vendor
          cp index.html app.js boot.js styles.css sw.js apple-touch-icon.png _site/
          cp vendor/jsqr.js _site/vendor/
          cp assets/the-string-project-logo.png _site/assets/
          cp assets/ableton-sync-logo.* _site/assets/ 2>/dev/null || true
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
